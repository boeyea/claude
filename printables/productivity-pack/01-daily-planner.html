<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <style>
        @page {
            size: letter;
            margin: 0.5in;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            color: #1F2937;
            background: white;
        }

        .page {
            width: 8.5in;
            min-height: 11in;
            padding: 0.5in;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #6366F1;
        }

        .header h1 {
            font-size: 28px;
            color: #6366F1;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .date-line {
            font-size: 14px;
            color: #6B7280;
            border-bottom: 1px solid #9CA3AF;
            padding: 4px;
            display: inline-block;
            min-width: 250px;
            text-align: center;
        }

        .focus-box {
            background: #EEF2FF;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #6366F1;
        }

        .focus-box .label {
            font-size: 13px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 8px;
        }

        .focus-box .input {
            border-bottom: 2px solid #6366F1;
            padding: 5px;
            min-height: 30px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #EEF2FF;
        }

        .priority-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 6px;
            background: #F9FAFB;
            border-left: 3px solid #6366F1;
        }

        .priority-item .number {
            background: #6366F1;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
            font-size: 12px;
        }

        .priority-item .text {
            flex: 1;
            border-bottom: 1px solid #9CA3AF;
            padding: 4px;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 0;
            margin-bottom: 15px;
        }

        .time-slot {
            display: contents;
        }

        .time {
            padding: 8px 10px;
            border: 1px solid #E5E7EB;
            background: #F9FAFB;
            font-size: 11px;
            font-weight: bold;
            color: #6B7280;
        }

        .activity {
            padding: 8px;
            border: 1px solid #E5E7EB;
            border-left: none;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 6px 0;
        }

        .checklist-item input {
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }

        .checklist-item .text {
            flex: 1;
            border-bottom: 1px dotted #9CA3AF;
            padding: 4px;
        }

        .notes-area {
            border: 2px solid #EEF2FF;
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
        }

        .wins-box {
            background: #EEF2FF;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .wins-box .label {
            font-size: 13px;
            font-weight: bold;
            color: #4F46E5;
            margin-bottom: 6px;
        }

        .wins-box .input {
            border-bottom: 1px solid #6366F1;
            padding: 5px;
            min-height: 25px;
        }

        @media print {
            body { margin: 0; padding: 0; }
            .page { margin: 0; padding: 0.5in; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>📅 DAILY PLANNER</h1>
            <div class="date-line">_________________, _____/_____/_______</div>
        </div>

        <div class="focus-box">
            <div class="label">🎯 TODAY'S FOCUS:</div>
            <div class="input"></div>
        </div>

        <div class="section">
            <div class="section-title">⭐ TOP 3 PRIORITIES</div>
            <div class="priority-item">
                <div class="number">1</div>
                <div class="text"></div>
            </div>
            <div class="priority-item">
                <div class="number">2</div>
                <div class="text"></div>
            </div>
            <div class="priority-item">
                <div class="number">3</div>
                <div class="text"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🕐 SCHEDULE</div>
            <div class="schedule-grid">
                <div class="time-slot"><div class="time">6:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">7:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">8:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">9:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">10:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">11:00 AM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">12:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">1:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">2:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">3:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">4:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">5:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">6:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">7:00 PM</div><div class="activity"></div></div>
                <div class="time-slot"><div class="time">8:00 PM</div><div class="activity"></div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">✅ TO-DO LIST</div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
            <div class="checklist-item"><input type="checkbox"><div class="text"></div></div>
        </div>

        <div class="wins-box">
            <div class="label">🏆 TODAY'S WINS:</div>
            <div class="input"></div>
        </div>
    </div>
</body>
</html>
